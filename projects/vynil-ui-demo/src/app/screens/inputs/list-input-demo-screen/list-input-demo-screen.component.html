<vui-view rowGap="2rem">
    <vui-text size="header">List Input</vui-text>
    <vui-card>
        <vui-view padding="1.5rem" rowGap="1.5rem">
            <vui-view rowGap="0.75rem">
                <vui-text size="l">List</vui-text>
                <vui-view flexDirection="row" columnGap="0.75rem" alignItems="center">
                    <vui-list-input
                        [formControl]="control"
                        [hasControls]="true"
                        [showIcons]="showIconsControl.value"
                        [showImages]="showImagesControl.value"
                        [selectedValue]="selectedEntry"
                        (selected)="onEntrySelected($event)"
                        width="20rem">
                    </vui-list-input>
                </vui-view>
            </vui-view>
            <vui-view flexDirection="row" alignItems="center" columnGap="0.5rem">
                <vui-toggle-input [formControl]="showIconsControl"></vui-toggle-input>
                <vui-text size="l">Show Icons</vui-text>
            </vui-view>
            <vui-view flexDirection="row" alignItems="center" columnGap="0.5rem">
                <vui-toggle-input [formControl]="showImagesControl"></vui-toggle-input>
                <vui-text size="l">Show Images</vui-text>
            </vui-view>
            <vui-view flexDirection="row" alignItems="center" columnGap="0.5rem">
                <vui-button (click)="onAddValue()">Add Value</vui-button>
            </vui-view>
            <vui-view justifyContent="stretch" rowGap="0.75rem" width="100%">
                <vui-text size="large">Values</vui-text>
                <vui-card cardStyle="dark" style="display: block; width: 100%">
                    <vui-view padding="1rem" rowGap="0.75rem" width="100%" style="display: block; width: 100%">
                        @for (entry of value; track identify($index, entry)) {
                            <vui-view flexDirection="row" width="18rem" justifyContent="flex-start" columnGap="1rem">
                                <vui-text>{{ entry.value }}</vui-text>
                                <vui-text>{{ entry.text }}</vui-text>
                            </vui-view>
                        }
                    </vui-view>
                </vui-card>
            </vui-view>
        </vui-view>
    </vui-card>
</vui-view>
