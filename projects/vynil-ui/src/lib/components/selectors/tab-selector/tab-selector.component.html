<vui-view flexDirection="row">
  @for (option of options; track option) {
    <div
      class="tab"
        [ngClass]="{
            'active': option === selectedTab,
            'attached': !standalone,
            'standalone': standalone
        }"
      (click)="onSelect(option)">
      {{ option }}
    </div>
  }
</vui-view>
