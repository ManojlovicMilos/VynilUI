<vui-card class="list-input" cardStyle="dark">
  <vui-view
    [flex]="flex"
    [width]="width"
    [height]="height"
    [margin]="margin"
    [padding]="padding"
    [minWidth]="minWidth"
    [maxWidth]="maxWidth"
    [scrollable]="true"
    rowGap="0"
    alignItems="stretch"
    justifyContent="flex-start">
    @if (localValue.length === 0) {
      <vui-view padding="0.5rem 1rem">
        <vui-text>{{ emptyText }}</vui-text>  
      </vui-view>
    }
    @for (entry of localValue; track identify($index, entry); let i = $index) {
      <vui-view
        class="entry"
        width="100%"
        padding="0.1rem 0"
        minHeight="1.5rem"
        columnGap="0.5rem"
        alignItems="center"
        flexDirection="row"
        (click)="onSelectOption(entry)"
        [ngClass]="{ 'active': selectedValue?.id === entry.id }">
        <vui-view flexDirection="row" columnGap="0.5rem" alignItems="center">
          @if (showImages && !!entry.image) {
            <vui-image [url]="entry.image" [height]="imageHeight" [circle]="roundImage"></vui-image>
          } @else if (showIcons && !!entry.icon) {
            <vui-icon [icon]="entry.icon" size="medium"></vui-icon>
          }
          <vui-text [size]="textSize">{{ entry.text }}</vui-text>
        </vui-view>
        @if (hasControls) {
          <vui-modify-options
            [isInline]="true"
            [hasMove]="hasMove"
            [hasEdit]="hasEdit"
            [hasCopy]="hasCopy"
            [hasRemove]="hasRemove"
            (moved)="onMove(i, $event)"
            (removed)="onRemove(entry)">
          </vui-modify-options>
        }
      </vui-view>
    }
  </vui-view>
</vui-card>
