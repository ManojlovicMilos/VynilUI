<vui-view [flexDirection]="isInline ? 'row' : 'column'" class="options" rowGap="0.5rem" columnGap="0.5rem" padding="0.25rem 0.5rem" alignItems="stretch">
  @if (hasMove) {
    <vui-view  flexDirection="row" columnGap="0.5rem" justifyContent="flex-end">
      <vui-icon [actionable]="true" size="button" (click)="onMove($event, -1)" icon="up"></vui-icon>
      <vui-icon [actionable]="true" size="button" (click)="onMove($event, 1)" icon="down"></vui-icon>
    </vui-view>
  }
  @if (hasEdit || hasCopy || hasRemove) {
    <vui-view flexDirection="row" columnGap="0.5rem">
      @if (hasEdit) {
        <vui-icon [actionable]="true" size="button" (click)="onEdit($event)" icon="edit"></vui-icon>
      }
      @if (hasCopy) {
        <vui-icon [actionable]="true" size="button" (click)="onCopy($event)" icon="copy"></vui-icon>
      }
      @if (hasRemove) {
        <vui-icon [actionable]="true" size="button" (click)="onRemove($event)" icon="remove"></vui-icon>
      }
    </vui-view>
  }
</vui-view>
