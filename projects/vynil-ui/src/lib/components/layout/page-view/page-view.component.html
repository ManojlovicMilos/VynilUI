<vui-card>
  @if (url) {
    <vui-view [scrollable]="true" maxHeight="80vh" padding="0.5rem">
      @if (isImageUrl) {
        <img
          [src]="sanitizedUrl"
          class="ignore_events"
          />
      }
      @if (!isImageUrl) {
        <iframe
          [src]="sanitizedUrl"
          title="Character Sheet"
          class="ignore_events">
        </iframe>
      }
    </vui-view>
  }
</vui-card>
